{% extends 'base.html' %}

{% block title %}Error — PDF Library{% endblock %}

{% block content %}
<div style="max-width:600px; margin-top:2rem;">
  <div class="flash flash-danger">
    <i class="fa-solid fa-circle-exclamation" style="margin-right:6px;"></i>{{ error_message }}
  </div>
  <a href="{{ url_for('index') }}" class="btn-reset" style="margin-top:1rem; display:inline-flex;">
    <i class="fa-solid fa-arrow-left"></i> Return to library
  </a>
</div>
{% endblock %}
